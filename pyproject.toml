[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab"
version = "0.1.0"
description = "AI 与机器学习实验室：ML 端到端（防泄漏实验）/ BM25 检索问答 / 交互式仪表盘"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "heee-a" }]
keywords = ["machine-learning", "rag", "bm25", "plotly", "portfolio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "joblib>=1.3",
    "jieba>=0.42",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = []   # 各项目独立脚本运行；测试通过 sys.path 自举

[tool.pytest.ini_options]
testpaths = ["tests"]
